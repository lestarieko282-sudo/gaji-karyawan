
name: Build APK Gaji PKS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o PKSGajiAndroid-1.zip -d extracted
          find extracted -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle project
        run: |
          echo "Folder hasil ekstraksi:"
          find extracted -maxdepth 4 -type f | head -100
          echo "Mencari settings.gradle..."
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "File settings.gradle tidak ditemukan."
            exit 1
          fi
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "File gradlew tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gaji-PKS-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
