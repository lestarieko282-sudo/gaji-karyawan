
name: Build APK Gaji PKS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o PKSGajiAndroid-1.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Locate Gradle project
        run: |
          echo "Mencari konfigurasi proyek:"
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      
      - name: Build APK
        run: |
          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          APP_FILE="$(find "$PROJECT_DIR" -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) | head -n 1)"

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: File Gradle modul app tidak ditemukan."
            exit 1
          fi

          echo "Menyesuaikan target Java ke versi 17 pada $APP_FILE"

          sed -i \
            -e 's/VERSION_1_8/VERSION_17/g' \
            -e 's/"1\.8"/"17"/g' \
            -e "s/'1\.8'/'17'/g" \
            "$APP_FILE"

          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
         

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gaji-PKS-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
